<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>SpendWise 💰</h1>
            <p>Track your expenses and manage your budget smartly.</p>
        </header>

        <!-- Budget Overview Dashboard -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-amount">$0.00</p>
            </div>
            <div class="card">
                <h3>Budget Status</h3>
                <p id="budget-status" class="status-normal">All good!</p>
            </div>
        </div>

        <!-- Expense Form -->
        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="input-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries, Transport" required>
                </div>
                
                <div class="input-group">
                    <label for="expense-amount">Amount ($)</label>
                    <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0.01" required>
                </div>

                <button type="submit" id="add-btn">Add Expense</button>
            </form>
        </section>

        <!-- Expenses List Section -->
        <section class="list-section">
            <h2>Expense History</h2>
            <ul id="expense-list">
                <!-- Dynamically populated via JavaScript -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
